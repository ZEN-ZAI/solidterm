[workspace]
resolver = "2"
members = [
    "crates/solidterm-engine",
    "crates/solidterm-config",
    "crates/solidterm-ffi",
]
# The vendored alacritty fork (see [patch.crates-io]) is a patch target,
# not a workspace member — keep cargo from treating it as one.
exclude = ["vendor/alacritty_terminal"]

# Vendored fork of alacritty_terminal 0.26.0 with a single local change:
# U+FE0F (Variation Selector-16) promotes its base cell to a full-width
# (WIDE_CHAR) glyph, so emoji-presentation sequences (⚠️ ℹ️ ☂️ …) render
# at two cells like other emoji (kitty / Ghostty behavior). The only edit
# is in src/term/mod.rs `Term::input`; re-audit it on every alacritty bump.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
repository = "https://github.com/ZEN-ZAI/solidterm"

[workspace.dependencies]
# Terminal engine (Stack A — saves ~2,000 LOC)
alacritty_terminal = "0.26"
vte = "0.13"

# Async + concurrency
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "time"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Serde + config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"

# Strings + collections
smallvec = "1"
smol_str = "0.3"

# Scrollback regex search.
regex = "1"

# Zero-copy byte-slice ↔ repr(C) struct conversion (FFI wire encoding)
bytemuck = { version = "1", features = ["derive"] }

# Filesystem watching + locking
notify = "6"
fs4 = { version = "0.13", features = ["sync"] }

# Errors + tracing
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# FFI
swift-bridge = "0.1"

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Abort (not unwind) on panic: the swift-bridge extern "C" surface is entered
# from Swift, and unwinding across that FFI boundary is unsupported. Aborting
# turns any unexpected engine panic into a deterministic process abort instead
# of an unwind into Swift. (Expected fallible paths like TerminalSession::new
# return nil rather than panicking — this is the backstop for everything else.)
panic = "abort"

[profile.dev]
opt-level = 1
# See [profile.release]: abort instead of unwinding across the swift-bridge FFI.
panic = "abort"
