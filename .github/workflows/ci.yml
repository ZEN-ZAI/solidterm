# CI workflow for SolidTerm.
#
# Jobs: Rust fmt + clippy, Rust test, FFI drift gate, deps audit,
# custom lints, and Swift lint + test on macos-14 and macos-15.
#
# Reference target: vault/research/14-quality-gates-and-ci.md (§7 ci.yml).
# Merge-gate table: same file, summary at the end.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CI: "true"

jobs:
  rust-fmt-clippy:
    name: Rust / fmt + clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features

  rust-test:
    name: Rust / test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  ffi-drift:
    name: FFI / swift-bridge drift gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fails if the committed swift-bridge shims under
      # app/SolidTerm/Generated/ don't match what `cargo build` would
      # produce. Caught a class of bug after zenzai-v2's build_snapshot
      # stub: stale generated mirror "looks right" on both sides but
      # silently invalidates the wire format.
      - run: scripts/check-ffi-drift.sh

  rust-deps:
    name: Rust / deps audit
    runs-on: ubuntu-latest  # platform-agnostic, cheaper
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  custom-lints:
    name: Custom lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-license-headers.sh
      - run: ./scripts/check-no-analytics.sh
      - run: ./scripts/check-ai-authored-tests.sh

  swift-test:
    name: Swift / test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [macos-14, macos-15] }
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: xcrun swift-format lint --strict --configuration app/.swift-format --recursive app/SolidTerm app/SolidTermTests
      # Per AGENTS.md §FFI conventions: any bridge.rs / extern shape change
      # requires xcodebuild *clean* test to avoid linking a stale
      # libsolidterm_ffi.a against freshly regenerated shims.
      - run: xcodebuild clean test -project app/SolidTerm.xcodeproj -scheme SolidTerm -destination 'platform=macOS' -configuration Debug
