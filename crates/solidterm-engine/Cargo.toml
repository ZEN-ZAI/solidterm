[package]
name = "solidterm-engine"
description = "Terminal engine — wraps alacritty_terminal for PTY/VT/grid + adds OSC routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
alacritty_terminal.workspace = true
vte.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
smol_str.workspace = true
regex.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Exposes test-only injection helpers (e.g. `TerminalEngine::inject_claude_block_for_test`)
# to other workspace crates that need to drive engine internals without
# spawning a real PTY subprocess. Off by default; enabled per dev-dep on
# the consuming side.
test-util = []

[dev-dependencies]
serde_json.workspace = true
criterion = "0.5"

[[bench]]
name = "hot_feed_1mb"
harness = false
