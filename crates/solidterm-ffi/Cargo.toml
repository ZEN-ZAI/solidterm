[package]
name = "solidterm-ffi"
description = "swift-bridge FFI surface — the only crate Swift links against"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Cross-language ABI version per spec/ffi-boundary.md §Versioning. Bump on
# any boundary-shape change. Swift bundle's Info.plist will assert match at
# load time once the runtime check lands. Namespaced under `solidterm` so the
# key cannot collide with future tool conventions on the bare
# `[package.metadata]` table.
[package.metadata.solidterm]
ffi_api_version = 1

[lib]
crate-type = ["staticlib"]

[lints]
workspace = true

[dependencies]
solidterm-engine = { path = "../solidterm-engine" }

swift-bridge.workspace = true
bytemuck.workspace = true
tracing.workspace = true

[build-dependencies]
swift-bridge-build = "0.1"
