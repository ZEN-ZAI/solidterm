# cargo-deny configuration for NextTerm.
#
# Spec: vault/research/14-quality-gates-and-ci.md (§7 dependency hygiene).
# CI invocation: .github/workflows/ci.yml `rust-deps` job (cargo-deny-action@v2).
#
# Workspace crates carry `license = "UNLICENSED"` per decisions/02 (license
# choice deferred to Phase 2). The `private.ignore = true` setting skips them
# in the licenses scan; advisories / bans / sources still cover the whole
# graph.

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Unicode-DFS-2016 covers older `unicode-ident` releases; Unicode-3.0
    # covers the relicensed current line. Both appear in the live graph.
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
exceptions = []

[licenses.private]
# Workspace crates are not published; their UNLICENSED status (decisions/02)
# is intentional and not subject to the allowlist.
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path-deps (e.g. `nextterm-blocks = { path = "../nextterm-blocks" }`)
# carry no version requirement and would otherwise trip the wildcard ban.
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
